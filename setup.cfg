[metadata]
name = mathematical model
description = mathematical model for the location routing problem with time windows
author = Simen Torseth
license = MIT
license_file = LICENSE
platforms = unix, osx
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11

[options]
packages =
    modelling
install_requires =
    gurobipy>=11
python_requires = >=3.9
package_dir =
    =src

[options.extras_require]
testing =
    pytest>=6.0
    pytest-cov>=2.0
    mypy>=0.910
    flake8>=3.9
    tox>=3.24

[options.package_data]
model = py.typed

[flake8]
max-line-length = 160